<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parking Clichy">
<meta name="theme-color" content="#2F353B">
<title>Parking Clichy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--vert:#1E7A3C;--orange:#F2A33A;--ardoise:#2F353B;--papier:#F7F6F2;--encre:#1b1f23}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--encre)}
#map{position:absolute;inset:0}
#banner{position:fixed;top:0;left:0;right:0;z-index:1000;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 14px;background:var(--ardoise);color:#fff;transition:background .25s}
#banner.z1{background:var(--vert);color:#fff}
#banner.z2{background:var(--orange);color:#2b1a00}
#banner h1{margin:0;font-size:clamp(28px,9vw,40px);line-height:1.05;font-weight:800;letter-spacing:-.01em}
#banner p{margin:4px 0 0;font-size:14px;opacity:.85}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;gap:10px;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
button{font:inherit;font-weight:700;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--papier);color:var(--encre);box-shadow:0 1px 6px rgba(0,0,0,.3);pointer-events:auto}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
#bar .sp{flex:1}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:1100;background:var(--papier);padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px);border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.3);max-height:70%;overflow:auto}
#panel[hidden]{display:none}
#panel p{margin:6px 0 10px;font-size:14px;line-height:1.4;max-width:60ch}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,52px);gap:6px;justify-content:center;margin:10px 0}
.pad button{padding:0;font-size:22px;background:#fff;border:1px solid #cfcdc4;box-shadow:none}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}
#panel button.s{background:#fff;border:1px solid #cfcdc4;box-shadow:none}
select,input[type=range]{font:inherit}
label{font-size:15px;font-weight:600}
.me{background:#1a73e8;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(26,115,232,.4)}
</style>
</head>
<body>
<div id="map"></div>
<div id="banner"><h1 id="t">Localisation en attente…</h1><p id="s">Autorise la localisation quand le navigateur le demande.</p></div>
<div id="bar"><button id="calBtn">Calibrer</button><span class="sp"></span><button id="ctr">Centrer</button></div>
<div id="panel" hidden>
  <div class="row"><b>Calibrer le plan</b><button class="s" id="close">Fermer</button></div>
  <p>Déplace, pivote et redimensionne le plan jusqu'à ce que les rues colorées recouvrent les vraies rues. Touche la carte pour tester une position.</p>
  <div class="pad"><button class="u" data-m="u" aria-label="Monter">↑</button><button class="l" data-m="l" aria-label="Gauche">←</button><button class="r" data-m="r" aria-label="Droite">→</button><button class="d" data-m="d" aria-label="Descendre">↓</button></div>
  <div class="row"><label>Pas (m, ° ) <select id="step"><option value="5">5 m</option><option value="20" selected>20 m</option><option value="100">100 m</option></select></label>
    <span>Taille <button class="s" id="sm" aria-label="Réduire">−</button> <button class="s" id="sp" aria-label="Agrandir">+</button></span></div>
  <div class="row"><span>Rotation <button class="s" id="rl" aria-label="Pivoter vers la gauche">↺</button> <button class="s" id="rr" aria-label="Pivoter vers la droite">↻</button></span><b id="rv">0°</b></div>
  <div class="row"><label for="op">Opacité</label><input type="range" id="op" min="20" max="100" style="flex:1"></div>
  <div class="row"><button class="s" id="clr">Effacer le test</button><button class="s" id="rst">Réinitialiser</button></div>
</div>

const W=1179,H=825,M_LAT=111200,M_LON=73300,M_PX=2.75;
const BASE={n:48.9141,s:48.8938,w:2.2842,e:2.3285};
const DEF={dLat:0,dLon:0,s:1,op:.85,rot:-30};
let cal=Object.assign({},DEF,load());
function load(){try{return JSON.parse(localStorage.getItem('cal'))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem('cal',JSON.stringify(cal))}catch(e){}}
function bounds(){const a=(BASE.n+BASE.s)/2+cal.dLat,o=(BASE.e+BASE.w)/2+cal.dLon,h=(BASE.n-BASE.s)/2*cal.s,k=(BASE.e-BASE.w)/2*cal.s;return {n:a+h,s:a-h,w:o-k,e:o+k}}
const lb=()=>{const b=bounds();return L.latLngBounds([[b.s,b.w],[b.n,b.e]])};

const map=L.map('map',{zoomControl:false}).setView([48.9040,2.3043],16);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const dot=L.marker([0,0],{icon:L.divIcon({className:'me',iconSize:[20,20]}),interactive:false,opacity:0}).addTo(map);
const ring=L.circle([0,0],{radius:0,color:'#1a73e8',weight:1,fillOpacity:.1,interactive:false}).addTo(map);
let overlay=null,maskC=null,grid=null,me=null,test=null,testMk=null,follow=true,shown=null,pend=null,cnt=0;

/* Lecture du plan : orange = 2, vert = 1 */
const img=new Image();
img.onload=()=>{
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);
  const d=x.getImageData(0,0,W,H).data;grid=new Uint8Array(W*H);
  const out=x.createImageData(W,H),o=out.data;
  const near=(r,g,b,R,G,B,m)=>(r-R)**2+(g-G)**2+(b-B)**2<m*m;
  for(let i=0;i<W*H;i++){
    const r=d[i*4],g=d[i*4+1],b=d[i*4+2];let v=0;
    if(near(r,g,b,232,168,80,62))v=2;else if(near(r,g,b,52,102,56,52))v=1;
    grid[i]=v;
    if(v){o[i*4]=v==2?242:30;o[i*4+1]=v==2?140:142;o[i*4+2]=v==2?0:62;o[i*4+3]=255}
  }
  const t=document.createElement('canvas');t.width=W;t.height=H;t.getContext('2d').putImageData(out,0,0);
  const f=document.createElement('canvas');f.width=W;f.height=H;const fx=f.getContext('2d');
  [[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(p=>fx.drawImage(t,p[0],p[1]));
  maskC=f;paint();
  if(me&&!test)setZone(zoneAt(me[0],me[1],me[2]));
};
img.src=PLAN;

const proj=L.Projection.SphericalMercator;
const DIM=Math.ceil(Math.hypot(W,H));
function geo(){const b=bounds(),a=proj.project(L.latLng(b.s,b.w)),c=proj.project(L.latLng(b.n,b.e));return {cx:(a.x+c.x)/2,cy:(a.y+c.y)/2,mx:(c.x-a.x)/W,my:(c.y-a.y)/H}}
function lbR(){const g=geo(),hx=DIM/2*g.mx,hy=DIM/2*g.my;return L.latLngBounds(proj.unproject(L.point(g.cx-hx,g.cy-hy)),proj.unproject(L.point(g.cx+hx,g.cy+hy)))}
function paint(){
  if(!maskC)return;
  const r=document.createElement('canvas');r.width=r.height=DIM;const x=r.getContext('2d');
  x.translate(DIM/2,DIM/2);x.rotate(cal.rot*Math.PI/180);x.drawImage(maskC,-W/2,-H/2);
  const u=r.toDataURL();
  if(overlay){overlay.setUrl(u);overlay.setBounds(lbR())}
  else overlay=L.imageOverlay(u,lbR(),{opacity:cal.op,interactive:false}).addTo(map);
}
function toPx(lat,lon){
  const g=geo(),p=proj.project(L.latLng(lat,lon)),dx=(p.x-g.cx)/g.mx,dy=(g.cy-p.y)/g.my,a=cal.rot*Math.PI/180,co=Math.cos(a),si=Math.sin(a);
  return [W/2+dx*co+dy*si,H/2-dx*si+dy*co];
}
function zoneAt(lat,lon,acc){
  if(!grid)return null;
  const [fx,fy]=toPx(lat,lon),x0=Math.round(fx),y0=Math.round(fy);
  if(x0<0||y0<0||x0>=W||y0>=H)return 0;
  const R=Math.max(3,Math.min(9,Math.round((acc||15)/(M_PX*cal.s)/1.5)));
  let dO=99,dG=99;
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
    const x=x0+dx,y=y0+dy;if(x<0||y<0||x>=W||y>=H)continue;
    const v=grid[y*W+x];if(!v)continue;
    const dd=Math.hypot(dx,dy);if(dd>R)continue;
    if(v==2&&dd<dO)dO=dd;if(v==1&&dd<dG)dG=dd;
  }
  if(dO<99&&dO<=dG+2)return 2;
  return dG<99?1:0;
}

const T=document.getElementById('t'),S=document.getElementById('s'),B=document.getElementById('banner');
const TXT={0:['Hors zone répertoriée','Cette rue ne figure pas sur le plan.'],1:['Zone verte','Indicatif · vérifie toujours la signalisation.'],2:['Zone orange','Indicatif · vérifie toujours la signalisation.']};
function render(z){B.className=z==1?'z1':z==2?'z2':'';if(z==null)return;T.textContent=TXT[z][0];S.textContent=TXT[z][1]}
function setZone(z,now){
  if(z==null)return;
  if(now||shown===null){shown=z;pend=null;cnt=0;return render(z)}
  if(z===shown){pend=null;cnt=0;return}
  if(z===pend)cnt++;else{pend=z;cnt=1}
  if(cnt>=2){shown=z;pend=null;cnt=0;render(z)}
}

/* GPS */
function onPos(p){
  const {latitude:la,longitude:lo,accuracy:ac}=p.coords;me=[la,lo,ac];
  dot.setLatLng(me).setOpacity(1);ring.setLatLng(me).setRadius(ac);
  if(follow)map.setView(me,Math.max(map.getZoom(),17),{animate:true});
  if(!test)setZone(zoneAt(la,lo,ac));
}
function onErr(e){if(!me){T.textContent='Localisation indisponible';S.textContent=e.code==1?'Autorise la localisation pour ce site dans les réglages du navigateur.':'Signal GPS introuvable. Sors à l’air libre et réessaie.'}}
if('geolocation' in navigator)navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
else onErr({code:0});
map.on('dragstart',()=>{follow=false});
document.getElementById('ctr').onclick=()=>{follow=true;if(me)map.setView(me,17)};

/* Écran allumé pendant la conduite */
let lock=null;
async function wake(){try{if('wakeLock' in navigator&&document.visibilityState=='visible')lock=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',wake);document.addEventListener('click',()=>{if(!lock)wake()},{once:true});

/* Calibrage */
const P=document.getElementById('panel');
const apply=(rp)=>{if(overlay){if(rp)paint();else overlay.setBounds(lbR());overlay.setOpacity(cal.op)}document.getElementById('rv').textContent=Math.round(cal.rot*10)/10+'°';save();const q=test?[test.lat,test.lng,10]:me;if(q)setZone(zoneAt(q[0],q[1],q[2]),true)};
document.getElementById('calBtn').onclick=()=>{P.hidden=false;document.getElementById('rv').textContent=Math.round(cal.rot*10)/10+'°';document.getElementById('op').value=Math.round(cal.op*100)};
document.getElementById('close').onclick=()=>{P.hidden=true};
document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{
  const m=+document.getElementById('step').value,k=b.dataset.m;
  if(k=='u')cal.dLat+=m/M_LAT;if(k=='d')cal.dLat-=m/M_LAT;
  if(k=='r')cal.dLon+=m/M_LON;if(k=='l')cal.dLon-=m/M_LON;apply()});
const fac=()=>{const m=+document.getElementById('step').value;return m<=5?.003:m<=20?.01:.03};
document.getElementById('sp').onclick=()=>{cal.s*=1+fac();apply()};
document.getElementById('sm').onclick=()=>{cal.s/=1+fac();apply()};
document.getElementById('op').oninput=e=>{cal.op=e.target.value/100;apply()};
const rstep=()=>{const m=+document.getElementById('step').value;return m<=5?.5:m<=20?2:5};
document.getElementById('rl').onclick=()=>{cal.rot-=rstep();apply(true)};
document.getElementById('rr').onclick=()=>{cal.rot+=rstep();apply(true)};
document.getElementById('rst').onclick=()=>{cal=Object.assign({},DEF);document.getElementById('op').value=85;apply(true)};
document.getElementById('clr').onclick=()=>{test=null;if(testMk){map.removeLayer(testMk);testMk=null}if(me)setZone(zoneAt(me[0],me[1],me[2]),true)};
map.on('click',e=>{
  if(P.hidden)return;test=e.latlng;
  if(testMk)testMk.setLatLng(test);else testMk=L.circleMarker(test,{radius:8,color:'#000',weight:2,fillColor:'#fff',fillOpacity:1,interactive:false}).addTo(map);
  follow=false;setZone(zoneAt(test.lat,test.lng,10),true);
});
</script>
</body>
</html>
